<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Blocket</title>

    <link
        rel="stylesheet"
        href="./style.css?v=20"
    >
</head>

<body>

    <!-- =====================================================
         START SCREEN
         ===================================================== -->

    <div
        id="startScreen"
        class="start-screen"
    >

        <div class="start-box">

            <h1>BLOCKET</h1>

            <button
                id="startLoginButton"
                class="start-button"
                type="button"
            >
                LOG IN
            </button>

            <button
                id="guestButton"
                class="start-button"
                type="button"
            >
                PLAY AS GUEST
            </button>

        </div>

    </div>


    <!-- =====================================================
         MAIN APP
         ===================================================== -->

    <div
        id="app"
        class="app"
        style="display: none;"
    >

        <!-- =================================================
             SIDEBAR
             ================================================= -->

        <aside class="sidebar">

            <div class="sidebar-logo">
                BLOCKET
            </div>

            <div class="sidebar-menu">

                <div
                    class="menu-item active"
                    data-tab="market"
                >
                    MARKET
                </div>

                <div
                    class="menu-item"
                    data-tab="blocks"
                >
                    BLOCKS
                </div>

                <div
                    class="menu-item"
                    data-tab="news"
                >
                    NEWS
                </div>

                <div
                    class="menu-item"
                    data-tab="solo"
                >
                    SOLO
                </div>

                <div
                    class="menu-item"
                    data-tab="settings"
                >
                    SETTINGS
                </div>

            </div>

        </aside>


        <!-- =================================================
             MAIN
             ================================================= -->

        <main class="main">

            <div class="player-info">

                <button
                    class="theme-button"
                    id="themeButton"
                    onclick="openTab('settings')"
                    aria-label="Open themes"
                    title="Themes"
                    type="button"
                >
                    🎨
                </button>

                <button
                    class="account-button"
                    onclick="openAccount()"
                    type="button"
                >
                    ACCOUNT
                </button>

                <div
                    class="coin-display"
                    id="coinDisplay"
                >
                    100 Coins
                </div>

            </div>


            <div
                class="main-content"
                id="mainContent"
            >
            </div>

        </main>

    </div>


    <!-- =====================================================
         ACCOUNT OVERLAY
         ===================================================== -->

    <div
        id="accountOverlay"
        class="account-overlay"
    >

        <div class="account-window">

            <button
                class="account-close"
                onclick="closeAccount()"
                aria-label="Close account"
                type="button"
            >
                ×
            </button>

            <h1>
                BLOCKET
            </h1>

            <div id="accountContent">

                <h2>
                    ACCOUNT
                </h2>

                <button
                    class="account-main-button"
                    onclick="showLogin()"
                    type="button"
                >
                    LOG IN
                </button>

                <button
                    class="account-main-button"
                    onclick="showSignup()"
                    type="button"
                >
                    SIGN UP
                </button>

            </div>

        </div>

    </div>


    <!-- =====================================================
         SUPABASE
         ===================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =====================================================
         BLOCKET JS
         ===================================================== -->

    <script
        src="./script.js?v=20"
    ></script>

</body>

</html>
