<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blocket</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- START SCREEN -->
    <section id="startScreen" class="start-screen">

        <div class="start-card">

            <div class="logo">
                BLOCKET
            </div>

            <p class="start-subtitle">
                Collect. Play. Discover.
            </p>

            <button id="loginStart" class="big-button">
                LOG IN
            </button>

            <button id="guestStart" class="big-button secondary">
                PLAY AS GUEST
            </button>

        </div>

    </section>


    <!-- MAIN APP -->
    <div id="app" class="app hidden">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="sidebar-logo">
                BLOCKET
            </div>

            <nav>

                <button class="nav-button active" data-tab="market">
                    <span>🛒</span>
                    MARKET
                </button>

                <button class="nav-button" data-tab="blocks">
                    <span>🧱</span>
                    BLOCKS
                </button>

                <button class="nav-button" data-tab="solo">
                    <span>🎮</span>
                    SOLO
                </button>

                <button class="nav-button" data-tab="news">
                    <span>📰</span>
                    NEWS
                </button>

                <button class="nav-button" data-tab="settings">
                    <span>⚙️</span>
                    SETTINGS
                </button>

            </nav>

        </aside>


        <!-- MAIN -->
        <main class="main">

            <header class="topbar">

                <button
                    id="themeQuick"
                    class="icon-button"
                    title="Themes"
                >
                    🎨
                </button>

                <div class="player-bar">

                    <div id="coinDisplay" class="coins">
                        100 Coins
                    </div>

                    <button id="accountButton" class="account-button">
                        ACCOUNT
                    </button>

                </div>

            </header>


            <section id="content" class="content"></section>

        </main>

    </div>


    <!-- ACCOUNT MODAL -->
    <div id="accountModal" class="modal hidden">

        <div class="modal-card">

            <button class="modal-close" id="closeAccount">
                ×
            </button>

            <div id="accountContent"></div>

        </div>

    </div>


    <!-- PACK OPENING -->
    <div id="opening" class="opening hidden">

        <div class="opening-card">

            <div id="openingRarity" class="opening-rarity">
                OPENING...
            </div>

            <div id="openingImage" class="opening-image">
                ?
            </div>

            <h2 id="openingName">
                Mystery Block
            </h2>

            <div id="openingPack">
                PACK
            </div>

        </div>

    </div>


    <!-- NOTIFICATION -->
    <div id="notification" class="notification">
        Hello!
    </div>


    <script src="script.js"></script>

</body>
</html>
